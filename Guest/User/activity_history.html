<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Activity History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .history-list {
      padding: 15px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
      font-size: 14px;
    }

    .date {
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>
  <header class="header">
    <a href="profile.html" class="back-btn"></a>
    <span class="logo">EcoRewards</span>
  </header>

  <div class="history-list">

    <div class="history-item">
      <div>
        <div class="date">3 Jan 2026</div> <!-- Example data -->
        3 Plastic Bottles
      </div>
      <div>+5 points</div>
    </div>

    <div class="history-item">
      <div>
        <div class="date">3 Jan 2026</div>
        1 Glass Bottle
      </div>
      <div>+5 points</div>
    </div>

    <div class="history-item">
      <div>
        <div class="date">2 Jan 2026</div>
        Paper Recycling
      </div>
      <div>+10 points</div>
    </div>

  </div>
</body>
</html>
