<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Rewards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<style>
.reward-card {
  margin: 15px;
  padding: 15px;
  background: white;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.reward-card button {
  background: #54a582;
  color: white;
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
}

/* POPUP */
.popup {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  justify-content: center;
  align-items: center;
}

.popup-box {
  background: white;
  padding: 20px;
  width: 85%;
  max-width: 300px;
  border-radius: 8px;
  text-align: center;
}

.popup-box button {
  margin: 10px;
  padding: 8px 20px;
  border-radius: 6px;
  border: none;
}

.confirm {
  background: #54a582;
  color: white;
}

.cancel {
  background: #ccc;
}

.hidden {
  display: none;
}
</style>
</head>

<body>
<div class="mobile-app">

<header class="header">
  <a href="profile.html" class="back-btn"></a>
  <span class="logo">EcoRewards</span>
</header>

<!-- REWARDS LIST -->
<div id="rewardList"></div>

<!-- POPUP -->
<div id="redeemPopup" class="popup hidden">
  <div class="popup-box">
    <p>Confirm use this voucher?</p>
    <button class="confirm" onclick="confirmUse()">Confirm</button>
    <button class="cancel" onclick="closePopup()">Cancel</button>
  </div>
</div>
<!-- VOUCHER CODE POPUP -->
<div id="voucherPopup" class="popup hidden">
  <div class="popup-box">
    <p>Your Voucher Code</p>
    <h3 id="voucherCode">CODE-123</h3>

    <button class="confirm" onclick="closeVoucherPopup()">OK</button>
  </div>
</div>

</div>

<script>
let selectedRewardId = null;

/* OPEN CONFIRM POPUP */
function openPopup(rewardId) {
  selectedRewardId = rewardId;
  document.getElementById("redeemPopup").classList.remove("hidden");
}

/* CLOSE CONFIRM POPUP */
function closePopup() {
  document.getElementById("redeemPopup").classList.add("hidden");
}

/* CONFIRM REDEEM */
function confirmUse() {
  closePopup();

  // mock voucher code (replace with backend later)
  const code = "ECO-" + selectedRewardId + "-2026";

  document.getElementById("voucherCode").textContent = code;
  document.getElementById("voucherPopup").classList.remove("hidden");

  // TODO (later):
  // fetch("/redeem_reward", { method: "POST", body: JSON.stringify({ rewardId }) })
}

/* CLOSE VOUCHER POPUP */
function closeVoucherPopup() {
  document.getElementById("voucherPopup").classList.add("hidden");
}
</script>

</body>
</html>
